<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-label="Estados propuestos para componentes web de SafeStep">
  <rect width="1100" height="390" fill="#f7f9fc"/>
  <text x="38" y="51" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Estados de componentes web</text>
  <text x="38" y="81" font-family="Arial,sans-serif" font-size="16" fill="#374151">Guía de diseño · no representa una captura del producto implementado</text>
  <g font-family="Arial,sans-serif" fill="#111827">
    <rect x="30" y="112" width="200" height="225" rx="14" fill="#fff" stroke="#d1d5db"/>
    <text x="51" y="145" font-size="18" font-weight="700">Predeterminado</text>
    <rect x="52" y="184" width="156" height="54" rx="9" fill="#0369a1"/>
    <text x="82" y="218" font-size="17" font-weight="700" fill="#fff">Practicar</text>
    <text x="51" y="278" font-size="15">Acción legible</text>
    <text x="51" y="302" font-size="15">y reconocible</text>

    <rect x="242" y="112" width="200" height="225" rx="14" fill="#fff" stroke="#d1d5db"/>
    <text x="264" y="145" font-size="18" font-weight="700">Hover</text>
    <rect x="264" y="184" width="156" height="54" rx="9" fill="#0c4a6e"/>
    <text x="294" y="218" font-size="17" font-weight="700" fill="#fff">Practicar</text>
    <text x="264" y="278" font-size="15">Cambio de fondo</text>
    <text x="264" y="302" font-size="15">sin cambiar etiqueta</text>

    <rect x="454" y="112" width="200" height="225" rx="14" fill="#fff" stroke="#d1d5db"/>
    <text x="476" y="145" font-size="18" font-weight="700">Foco</text>
    <rect x="474" y="180" width="160" height="62" rx="12" fill="none" stroke="#f97316" stroke-width="4"/>
    <rect x="478" y="184" width="152" height="54" rx="9" fill="#0369a1"/>
    <text x="508" y="218" font-size="17" font-weight="700" fill="#fff">Practicar</text>
    <text x="476" y="278" font-size="15">Anillo visible</text>
    <text x="476" y="302" font-size="15">para teclado</text>

    <rect x="666" y="112" width="200" height="225" rx="14" fill="#fff" stroke="#d1d5db"/>
    <text x="688" y="145" font-size="18" font-weight="700">Deshabilitado</text>
    <rect x="688" y="184" width="156" height="54" rx="9" fill="#d1d5db"/>
    <text x="718" y="218" font-size="17" font-weight="700" fill="#374151">Practicar</text>
    <text x="688" y="278" font-size="15">Explicar por qué</text>
    <text x="688" y="302" font-size="15">no está disponible</text>

    <rect x="878" y="112" width="192" height="225" rx="14" fill="#fff" stroke="#d1d5db"/>
    <text x="900" y="145" font-size="18" font-weight="700">Error</text>
    <rect x="900" y="184" width="148" height="54" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="3"/>
    <text x="914" y="218" font-size="17" fill="#374151">Correo</text>
    <text x="900" y="269" font-size="14" font-weight="700" fill="#b91c1c">Revisa el formato</text>
    <text x="900" y="291" font-size="14" fill="#374151">y vuelve a intentar.</text>
  </g>
  <text x="38" y="369" font-family="Arial,sans-serif" font-size="14" fill="#52627b">La combinación azul claro #0ea5e9 + texto blanco no se propone para texto normal por contraste insuficiente.</text>
</svg>
